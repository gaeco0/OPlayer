name: Build and release

on:
  workflow_dispatch:
    inputs:
      replace_release:
        description: Replace this version's release files and move its tag to the built commit
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  windows:
    name: Windows build and tests
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: node test/browser_interactions_test.cjs
      - run: node test/web_sniffer_test.cjs
      - run: node .github/scripts/publish-release.test.cjs
      - run: python .github/scripts/package-release.test.py
      - run: flutter build windows --release --no-pub
      - name: Package complete application
        if: github.event_name != 'pull_request'
        run: python .github/scripts/package-release.py windows-x64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request'
        with:
          name: release-windows-x64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  android:
    name: ${{ matrix.name }} build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android
            flavor: mobile
          - name: Android TV
            flavor: tv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Android SDK components
        # The runner image does not guarantee Android command-line tools on PATH.
        run: sdkmanager 'platforms;android-36' 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - run: flutter pub get
      - name: Restore release signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          names = ['KEYSTORE_BASE64', 'STORE_PASSWORD', 'KEY_PASSWORD', 'KEY_ALIAS']
          if any(not os.environ.get(name) for name in names):
              raise SystemExit('Configure all four ANDROID_* signing secrets before a release build.')
          os.umask(0o077)
          key = Path('android/keystores/oplayer-release.p12')
          key.parent.mkdir(parents=True, exist_ok=True)
          key.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          def property_value(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r')
          properties = {
              'storeFile': 'keystores/oplayer-release.p12',
              'storePassword': os.environ['STORE_PASSWORD'],
              'keyPassword': os.environ['KEY_PASSWORD'],
              'keyAlias': os.environ['KEY_ALIAS'],
          }
          Path('android/key.properties').write_text(
              ''.join(f'{name}={property_value(value)}\n' for name, value in properties.items()), encoding='utf-8')
          PY
      - name: Build signed release APKs
        if: github.event_name != 'pull_request'
        run: flutter build apk --release --flavor "${{ matrix.flavor }}" --split-per-abi --no-pub
      - name: Verify APK signatures
        if: github.event_name != 'pull_request'
        run: |
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          done
      - name: Build pull request without signing secrets
        if: github.event_name == 'pull_request'
        run: flutter build apk --debug --flavor "${{ matrix.flavor }}" --no-pub
      - name: Package signed APKs
        if: github.event_name != 'pull_request'
        run: python3 .github/scripts/package-release.py "${{ matrix.flavor }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request'
        with:
          name: release-android-${{ matrix.flavor }}
          path: release-assets/*.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Remove temporary signing files
        if: always()
        run: rm -f android/key.properties android/keystores/oplayer-release.p12

  linux:
    name: Linux build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev libsecret-1-dev libjsoncpp-dev libmpv-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libjpeg-dev libpulse-dev libasound2-dev libepoxy-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release --no-pub
      - name: Package complete application
        if: github.event_name != 'pull_request'
        run: python .github/scripts/package-release.py linux-x64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request'
        with:
          name: release-linux-x64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  macos:
    name: macOS build
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get
      - run: flutter build macos --release --no-pub
      - name: Package complete application
        if: github.event_name != 'pull_request'
        run: python .github/scripts/package-release.py macos-arm64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request'
        with:
          name: release-macos-arm64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    name: Publish release downloads
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [windows, android, linux, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Attach all platform builds and checksums
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await require('./.github/scripts/publish-release.cjs')({github, context, core});
