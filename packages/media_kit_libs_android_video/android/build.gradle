import java.io.File

group 'com.alexmercerind.media_kit_libs_android_video'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.alexmercerind.media_kit_libs_android_video'
    }

    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 16
    }

    dependencies {
        implementation fileTree(dir: "$buildDir/output", include: "*.jar")
    }
}

task downloadDependencies(type: Exec) {
        // Delete previously created /output subdirectory.

        def outputDir = file("$buildDir/output")
        if (outputDir.exists()) {
            outputDir.deleteDir()
        }
        outputDir.mkdirs()

        // Download all *.jar dependencies & verify their SHA-256 checksums.
        def filesToDownload = [
            ["asset": "346694503", "sha256": "cdb54c5cf24725623ca717bbbd6d991031d625a377460bd128f19c2dffe189bd", "destination": file("$buildDir/v1.1.11/full-arm64-v8a.jar")],
            ["asset": "346694508", "sha256": "b658f2ff91169f8dad0e09e0240ebe200bb3df999da5712f8fab96ad11a4fbec", "destination": file("$buildDir/v1.1.11/full-armeabi-v7a.jar")],
            ["asset": "346694501", "sha256": "848936cfd7333077f21759adaca4a9e1a5647891da2e42ab211c5bdc30f4535d", "destination": file("$buildDir/v1.1.11/full-x86_64.jar")],
            ["asset": "346694506", "sha256": "8b3b84e54ec09bb79972095dc04bcaf651294da4e73b1e7c3251055fd8a2b901", "destination": file("$buildDir/v1.1.11/full-x86.jar")]
        ]

        filesToDownload.each { fileInfo ->
            def destFile = fileInfo.destination
            def python = System.getenv("PYTHON") ?: "python3"
            def downloader = new File(projectDir, "../../../.github/scripts/github_asset.py").canonicalPath
            def process = new ProcessBuilder(python, downloader,
                "media-kit/libmpv-android-video-build", fileInfo.asset,
                fileInfo.sha256, destFile.absolutePath).inheritIO().start()
            if (process.waitFor() != 0) {
                throw new GradleException("Verified dependency download failed: ${destFile.name}")
            }

            copy {
                from destFile
                into outputDir
            }
        }
}

assemble.dependsOn(downloadDependencies)
